<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f766e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle for PWA -->
  <rect width="512" height="512" rx="112" fill="url(#medGrad)"/>
  
  <!-- Clinical shield / caduceus / leaf symbol -->
  <g filter="url(#softGlow)" transform="translate(106, 106) scale(0.5859375)">
    <!-- Shield / Base container -->
    <path d="M256 30 C160 30 70 80 70 200 C70 340 180 430 256 480 C332 430 442 340 442 200 C442 80 352 30 256 30 Z" fill="#ffffff" opacity="0.96"/>
    
    <!-- Medical Cross with Organic Leaf Accents -->
    <!-- Vertical Cross bar -->
    <rect x="232" y="120" width="48" height="180" rx="14" fill="#0d9488"/>
    <!-- Horizontal Cross bar -->
    <rect x="166" y="186" width="180" height="48" rx="14" fill="#0d9488"/>
    
    <!-- Clinical Nutrition Leaf motif intertwining -->
    <path d="M256 210 Q340 150 360 270 Q280 290 256 210 Z" fill="#10b981" opacity="0.85"/>
    <path d="M256 210 Q172 150 152 270 Q232 290 256 210 Z" fill="#0ea5e9" opacity="0.75"/>
    
    <!-- Core healthy dot -->
    <circle cx="256" cy="350" r="18" fill="#059669"/>
  </g>
</svg>
